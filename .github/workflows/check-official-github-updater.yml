name: Check Official GitHub Updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-official-github-updater.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate official GitHub API over IPv4
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.github.com/repos/yangxiaodegit/family-menu/contents/updates/promotion-finance-bridge'
          curl -4 -L --fail --max-time 20             -H 'Accept: application/vnd.github.raw+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API/latest.json?ref=main" -o /tmp/latest.json
          cat /tmp/latest.json
          VERSION="$(python3 -c "import json;print(json.load(open('/tmp/latest.json'))['version'])")"
          EXE="$(python3 -c "import json;print(json.load(open('/tmp/latest.json'))['setup'])")"
          SHA="$(python3 -c "import json;print(json.load(open('/tmp/latest.json'))['sha256'])")"
          SIZE="$(python3 -c "import json;print(json.load(open('/tmp/latest.json'))['size'])")"
          curl -4 -L --fail --max-time 60             -H 'Accept: application/vnd.github.raw+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API/$EXE?ref=main" -o /tmp/update.exe
          test "$(stat -c '%s' /tmp/update.exe)" = "$SIZE"
          test "$(sha256sum /tmp/update.exe | awk '{print $1}')" = "$SHA"
          echo "official GitHub API verified version=$VERSION size=$SIZE sha256=$SHA"
