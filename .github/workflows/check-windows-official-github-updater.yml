name: Check Windows Official GitHub Updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-windows-official-github-updater.yml'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Validate updater path on Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/yangxiaodegit/family-menu/contents/updates/promotion-finance-bridge'
          curl.exe --ipv4 --http1.1 --fail --location --silent --show-error --connect-timeout 10 --max-time 90 -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: PromotionFinanceBridge/windows-check" -o "$env:TEMP\latest.json" "$api/latest.json?ref=main"
          $m = Get-Content "$env:TEMP\latest.json" -Raw | ConvertFrom-Json
          curl.exe --ipv4 --http1.1 --fail --location --silent --show-error --connect-timeout 10 --max-time 90 -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: PromotionFinanceBridge/windows-check" -o "$env:TEMP\update.exe" "$api/$($m.setup)?ref=main"
          $size = (Get-Item "$env:TEMP\update.exe").Length
          if ($size -ne [int64]$m.size) { throw "size mismatch $size != $($m.size)" }
          $sha = (Get-FileHash "$env:TEMP\update.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $m.sha256.ToLowerInvariant()) { throw "sha mismatch $sha != $($m.sha256)" }
          Write-Host "Windows curl IPv4 official GitHub API verified v$($m.version) size=$size sha=$sha"
