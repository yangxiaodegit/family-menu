name: ThreeSite 2.0.15 Release Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-three-site-2.0.15.yml'
      - '.github/scripts/verify-three-site-release.py'
permissions:
  contents: read
concurrency:
  group: publish-three-site-2-0-15
  cancel-in-progress: false
env:
  EXPECTED_SHA256: '60b8a27825df111e1a97604efd58ae05f144f71cd0f4b89d97f2fec39e6dcdf4'
  EXPECTED_SIZE: '16251392'
# Initial publication completed in run 36539311027. All subsequent runs use
# only published GitHub bytes; no expiring transfer URL or private source access.
jobs:
  verify_release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify the approved public channel without rewriting any files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,struct,os
          dest=pathlib.Path('updates/three-site-replenishment')
          setup='Three_Site_Replenishment_Setup_2.0.15.exe'
          expected=os.environ['EXPECTED_SHA256'];size=int(os.environ['EXPECTED_SIZE'])
          raw=(dest/setup).read_bytes()
          m=json.loads((dest/'latest.json').read_text(encoding='utf-8'))
          assert (m['product'],m['version'],m['platform'],m['arch'],m['setup'])==('ThreeSiteReplenishment','2.0.15','windows','amd64',setup)
          assert len(raw)==m['size']==size and hashlib.sha256(raw).hexdigest()==m['sha256']==expected
          pe=struct.unpack_from('<I',raw,0x3c)[0]
          assert raw[:2]==b'MZ' and raw[pe:pe+4]==b'PE\x00\x00'
          assert struct.unpack_from('<H',raw,pe+4)[0]==0x8664 and struct.unpack_from('<H',raw,pe+24+68)[0]==2
          print('APPROVED 2.0.15',size,expected)
          PY
          git diff --exit-code
      - name: Verify published Release assets match the update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='three-site-v2.0.15'
          EXE='Three_Site_Replenishment_Setup_2.0.15.exe'
          gh release view "$TAG" --json tagName,isDraft,isPrerelease > /tmp/release.json
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/release.json').read_text())
          assert r['tagName']=='three-site-v2.0.15' and not r['isDraft'] and not r['isPrerelease']
          PY
          mkdir -p /tmp/existing-release
          gh release download "$TAG" --pattern "$EXE" --pattern latest.json --dir /tmp/existing-release
          echo "$EXPECTED_SHA256  /tmp/existing-release/$EXE" | sha256sum --check -
          cmp /tmp/existing-release/latest.json updates/three-site-replenishment/latest.json
  verify_official_download:
    needs: verify_release
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Download official binaries and validate native cross-volume upgrade
        shell: pwsh
        run: |
          python .github/scripts/verify-three-site-release.py
          if($LASTEXITCODE -ne 0){throw 'Official download or native upgrade validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-site-2.0.15-official-verification
          path: release-verification
          retention-days: 30
  attach_verification:
    needs: verify_official_download
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: three-site-2.0.15-official-verification
          path: verified
      - name: Preserve successful native verification with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          r=json.loads(pathlib.Path('verified/windows-official-download.json').read_text())
          assert r['all_passed'] and r['version']=='2.0.15'
          assert r['sha256']==os.environ['EXPECTED_SHA256'] and r['size']==int(os.environ['EXPECTED_SIZE'])
          PY
          gh release upload three-site-v2.0.15 verified/windows-official-download.json --clobber --repo "$GITHUB_REPOSITORY"
