name: Publish PromotionFinanceBridge Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-promotion-finance-bridge-update.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-aa3c-8206-a240-51def6975c12/raw?se=2026-09-28T15%3A39%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=02ba87c3-3003-595f-b26e-99f80e44de36&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A50%3A38Z&ske=2026-09-29T00%3A50%3A38Z&sks=b&skv=2026-02-06&sig=8hpDsxMGfksRNviMJk8pmhpO19lRg8/iDtI7nPik2Hw%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download verified private build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/update.zip
          rm -rf /tmp/update && mkdir -p /tmp/update
          unzip -q /tmp/update.zip -d /tmp/update
          find /tmp/update -maxdepth 4 -type f -print
          SRC="$(find /tmp/update -type d -path '*/promotion-finance-bridge' | head -n1)"
          if [ -z "$SRC" ]; then
            if [ -d /tmp/update/promotion-finance-bridge ]; then SRC=/tmp/update/promotion-finance-bridge; else exit 2; fi
          fi
          test -f "$SRC/latest.json"
          EXE="$(find "$SRC" -maxdepth 1 -type f -name 'PromotionFinanceBridge_Setup_v*.exe' | head -n1)"
          test -n "$EXE"
          python3 - "$SRC/latest.json" "$EXE" <<'PY'
          import hashlib,json,pathlib,sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          exe=pathlib.Path(sys.argv[2])
          raw=exe.read_bytes()
          assert manifest['size']==len(raw)
          assert manifest['sha256'].lower()==hashlib.sha256(raw).hexdigest()
          assert manifest['setup']==exe.name
          print('verified',manifest['version'],len(raw),manifest['sha256'])
          PY
          mkdir -p updates/promotion-finance-bridge
          rm -f updates/promotion-finance-bridge/PromotionFinanceBridge_Setup_v*.exe
          cp "$SRC/latest.json" updates/promotion-finance-bridge/latest.json
          cp "$EXE" updates/promotion-finance-bridge/
      - name: Commit public update payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/promotion-finance-bridge
          if git diff --cached --quiet; then
            echo "No update changes"
          else
            git commit -m "Publish PromotionFinanceBridge v0.2.4 updater"
            git push
          fi
