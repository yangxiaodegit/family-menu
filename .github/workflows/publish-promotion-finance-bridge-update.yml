name: Publish PromotionFinanceBridge Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-promotion-finance-bridge-update.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-37a8-8209-9301-0ec406620310/raw?se=2026-09-28T16%3A56%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=820bf563-6d1c-5658-96d9-3b2c74b4dc54&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T10%3A25%3A52Z&ske=2026-09-29T10%3A25%3A52Z&sks=b&skv=2026-02-06&sig=6kwELEKuJfnsYgb/CAGEMWcShClW2u6c0VooXQccr1E%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify private build
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/update.zip
          rm -rf /tmp/update && mkdir -p /tmp/update
          unzip -q /tmp/update.zip -d /tmp/update
          SRC="$(find /tmp/update -type d -path '*/promotion-finance-bridge' | head -n1)"
          test -n "$SRC"
          test -f "$SRC/latest.json"
          EXE="$(find "$SRC" -maxdepth 1 -type f -name 'PromotionFinanceBridge_Setup_v*.exe' | head -n1)"
          test -n "$EXE"
          python3 - "$SRC/latest.json" "$EXE" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          m=json.loads(p.read_text(encoding='utf-8'))
          e=pathlib.Path(sys.argv[2]); raw=e.read_bytes()
          assert m['version']=='0.2.13'
          assert m['size']==len(raw)
          assert m['sha256'].lower()==hashlib.sha256(raw).hexdigest()
          assert m['setup']==e.name
          m['notes']='v0.2.13 增加真实在线升级进度：显示下载百分比、已下载/总大小，并依次显示校验中、安装中和自动重启状态。'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding='utf-8')
          print('verified',m['version'],len(raw),m['sha256'])
          PY
          mkdir -p updates/promotion-finance-bridge
          rm -f updates/promotion-finance-bridge/PromotionFinanceBridge_Setup_v*.exe
          cp "$SRC/latest.json" updates/promotion-finance-bridge/latest.json
          cp "$EXE" updates/promotion-finance-bridge/
      - name: Commit public update payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/promotion-finance-bridge
          git commit -m "Publish PromotionFinanceBridge v0.2.13 updater"
          git push
